spring.application.name=quickcommerce-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quickcommerce}
spring.datasource.username=${DATABASE_USER:quickcommerce}
spring.datasource.password=${DATABASE_PASSWORD:}

# ---- Behaviour under load ----
# Database connections shared by all request threads.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# A request waits at most this long (ms) for a free connection, then gets a quick 503
# instead of hanging. The default is 30 seconds.
spring.datasource.hikari.connection-timeout=3000
# No single statement may run longer than this; a runaway query is cut off (and answers 503)
# so it cannot hold a connection hostage. A slow migration can lift it for itself with
# "set local statement_timeout = 0;" on its first line.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'

# Flyway owns the schema. Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors come back as RFC 7807 problem+json.
spring.mvc.problemdetails.enabled=true

# No default on purpose: the app must not start with a known secret. Min 32 chars.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=12h
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# If both are set, an ADMIN user is created at startup when missing.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Signups + logins allowed per client IP per minute.
app.auth.ip-limit-per-minute=${AUTH_IP_LIMIT_PER_MINUTE:60}
# IMPORTANT behind a load balancer or reverse proxy: set FORWARD_HEADERS_STRATEGY=native
# so the client IP is read from X-Forwarded-For. Leave it "none" when the app is
# reached directly, or anyone could fake their IP with that header.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Pages serialize as {content, page:{size, number, totalElements, totalPages}}.
spring.data.web.pageable.serialization-mode=via-dto

# The API contract and Swagger UI. Set API_DOCS_ENABLED=false to hide them in production.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# ---- Orders ----
# Markup, delivery fee and driver pay are set by admin (PUT /api/admin/settings), stored in the database.
# A customer can only see and order from shops within this straight-line distance.
app.orders.max-distance-km=${MAX_DELIVERY_KM:5}
# A shop has this long to accept or reject. After that the order expires and its stock is returned.
app.orders.accept-timeout=10m
# How often the expiry check runs, in milliseconds.
app.orders.expiry-check-ms=60000

# ---- Browsing ----
# Estimated delivery time = prep-minutes + distance in km x minutes-per-km, rounded up.
# These are guesses to tune with real deliveries. Distance is straight-line, so
# minutes-per-km already allows for roads not being straight.
app.browse.prep-minutes=10
app.browse.minutes-per-km=3

# ---- Drivers and dispatch ----
# A job is offered to online drivers within this straight-line distance of the shop.
app.dispatch.offer-radius-km=8
# A driver whose last location ping is older than this is treated as not reachable.
app.dispatch.location-max-age=2m
# How often to look for drivers holding an order whose location stopped updating (ms).
app.dispatch.location-check-ms=60000
# The time zone that decides "today" for daily violation limits and admin charts, and when pay periods start.
app.business-time-zone=${BUSINESS_TIME_ZONE:America/Vancouver}
# Driver pay periods: two weeks, starting on this Tuesday. Pay day is the Tuesday a period ends on.
app.pay.period-anchor=2026-12-01
# Location pings allowed per driver per minute (the app sends about 12).
app.dispatch.max-pings-per-minute=${DRIVER_MAX_PINGS_PER_MINUTE:60}

# ---- Health check ----
# GET /actuator/health answers {"status":"UP"} (no details) when the app and database are fine.
management.endpoints.web.exposure.include=health
