# Used by the tests and by DevApplication (local run). Never used in production:
# this file is in src/test and is not packaged into the jar.
app.jwt.secret=dev-only-secret-not-for-production-0123456789
app.admin.email=admin@quickcommerce.test
app.admin.password=dev-admin-pass-1
# All tests come from 127.0.0.1, so the per-IP limit is switched off here.
# IpThrottleTest turns it back on for itself.
app.auth.ip-limit-per-minute=1000000
# Load tests ping from one driver far faster than a phone would.
app.dispatch.max-pings-per-minute=1000000
# The API docs are on for local development and tests.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Tests send far more requests per user, and more checkouts at once, than a person would.
# RateLimitTest turns the limits back on for itself.
app.rate-limit.per-user-per-minute=1000000
app.rate-limit.per-ip-per-minute=1000000
app.orders.checkouts-per-minute=1000000
app.orders.quotes-per-minute=1000000
app.orders.max-concurrent-checkouts=1000
